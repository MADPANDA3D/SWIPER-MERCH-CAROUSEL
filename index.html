<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwiperJS Merchandise Carousel</title>
  
  <!-- SwiperJS CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
</head>
<body>
  <h1 style="text-align: center; font-family: Arial, sans-serif; margin-top: 2rem;">SwiperJS Merchandise Carousel</h1>
  <p style="text-align: center; font-family: Arial, sans-serif; margin-bottom: 2rem; color: #666;">Customizable product display carousel using SwiperJS v11</p>

  <!-- Outer Container -->
  <div style="width: 100%; background-color: #1C3C93; padding: 60px 0; box-sizing: border-box;">
    <div class="swiper-container" style="max-width: 900px; margin: auto; position: relative;">
      <div class="swiper-wrapper" style="align-items: center;">

        <!-- Placeholder Slides: replace URLs with your own -->
        <div class="swiper-slide"><img src="https://example.com/images/slide1.jpg" style="width:65%; border-radius: 10px; display: block; margin: auto;" /><!-- Add your image URL here --></div>
        <div class="swiper-slide"><img src="https://example.com/images/slide2.jpg" style="width:65%; border-radius: 10px; display: block; margin: auto;" /><!-- Add your image URL here --></div>
        <div class="swiper-slide"><img src="https://example.com/images/slide3.jpg" style="width:65%; border-radius: 10px; display: block; margin: auto;" /><!-- Add your image URL here --></div>
        <div class="swiper-slide"><img src="https://example.com/images/slide4.jpg" style="width:65%; border-radius: 10px; display: block; margin: auto;" /><!-- Add your image URL here --></div>
        <div class="swiper-slide"><img src="https://example.com/images/slide5.jpg" style="width:65%; border-radius: 10px; display: block; margin: auto;" /><!-- Add your image URL here --></div>

      </div>

      <!-- Pagination & Arrows below -->
      <div style="display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 30px;">
        <div class="swiper-button-prev" style="position: static; width: 32px; height: 32px; color: white; cursor: pointer;"></div>
        <div class="swiper-pagination" style="position: static;"></div>
        <div class="swiper-button-next" style="position: static; width: 32px; height: 32px; color: white; cursor: pointer;"></div>
      </div>
    </div>
  </div>

  <!-- Swiper Config -->
  <script>
    let autoplayPaused = false;
    let autoplayTimeout;

    const swiper = new Swiper(".swiper-container", {
      effect: "coverflow",
      grabCursor: true,
      centeredSlides: true,
      slidesPerView: "auto",
      speed: 1200,
      loop: true,
      coverflowEffect: {
        rotate: 0,
        stretch: 300,  // 👈 Tight overlap
        depth: 350,
        modifier: 0.85,
        slideShadows: false,
      },
      autoplay: {
        delay: 3000,
        disableOnInteraction: false
      },
      navigation: {
        nextEl: ".swiper-button-next",
        prevEl: ".swiper-button-prev"
      },
      pagination: {
        el: ".swiper-pagination",
        clickable: true
      },
      on: {
        slideChangeTransitionStart: () => {
          if (!autoplayPaused) pauseAutoplay();
        }
      }
    });

    function pauseAutoplay() {
      autoplayPaused = true;
      swiper.autoplay.stop();
      clearTimeout(autoplayTimeout);
      autoplayTimeout = setTimeout(() => {
        swiper.autoplay.start();
        autoplayPaused = false;
      }, 5000);
    }
  </script>

  <!-- Style Dots White -->
  <style>
    .swiper-pagination-bullet {
      background: white !important;
      opacity: 0.5;
    }
    .swiper-pagination-bullet-active {
      opacity: 1 !important;
    }
  </style>
</body>
</html>
